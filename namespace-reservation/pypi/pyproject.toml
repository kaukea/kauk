[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kauk"
version = "0.0.0"
description = "Reserved namespace for the KAUK package platform (https://kauk.ai). Placeholder release — no functionality yet."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Sebastien Lambla" }]
keywords = ["kauk", "packaging", "package-manager", "placeholder"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://kauk.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/kauk"]
